name: candidate-image
on:
  push:
    branches: ['candidate/**']
  workflow_dispatch: {}
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Free runner disk (dotnet, android, ghc, codeql)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push production image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: production
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/paperclip-candidate:v2026.1023.0
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/paperclip-candidate:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/paperclip-candidate:buildcache,mode=max
      - name: Report
        run: echo "pushed ghcr.io/${{ github.repository_owner }}/paperclip-candidate:v2026.1023.0"
