name: Hotpatch UI performance server and UI build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and typecheck server
        run: |
          pnpm --filter '@paperclipai/server^...' build
          pnpm --filter @paperclipai/server build
          pnpm --filter @paperclipai/server typecheck
      - name: U2, route, and review-policy suites
        run: >-
          pnpm exec vitest run
          server/src/__tests__/attention-service.test.ts
          server/src/__tests__/dashboard-service.test.ts
          server/src/services/attention-null-key-scope.test.ts
          server/src/__tests__/issue-list-assignee-filter-routes.test.ts
          server/src/__tests__/issue-execution-policy.test.ts
          server/src/__tests__/approval-routes-idempotency.test.ts
          server/src/__tests__/approvals-count-db.test.ts
          server/src/__tests__/routines-e2e.test.ts
          server/src/__tests__/issue-stalled-review-decision-routes.test.ts
          server/src/services/attention-multikey-plan.test.ts
          server/src/services/dashboard-recovered-plan.test.ts
          --reporter=dot
      - name: Artifact manifest
        run: |
          cd server
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist-sha256.txt
          sha256sum dist-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: server-dist-${{ github.sha }}
          path: |
            server/dist/
            server/dist-sha256.txt
          if-no-files-found: warn
          retention-days: 7
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build UI workspace dependencies and typecheck UI
        run: |
          pnpm --filter '@paperclipai/ui^...' build
          pnpm --filter @paperclipai/ui typecheck
      - name: UI performance suites
        run: >-
          pnpm exec vitest run
          ui/src/api/attention.test.ts
          ui/src/api/issues.test.ts
          ui/src/api/dashboard-paged-sources.test.ts
          ui/src/components/IssuesList.test.tsx
          ui/src/components/dashboard/BoardAttentionSheet.test.tsx
          ui/src/context/EditorAutocompleteContext.test.tsx
          ui/src/hooks/useInboxBadge.test.tsx
          ui/src/hooks/useInboxBadge.approvals.test.tsx
          ui/src/lib/inboxArchiveCache.test.ts
          ui/src/lib/vite-sw-build-id.test.ts
          ui/src/lib/dashboard-operations.test.ts
          ui/src/pages/Dashboard.test.ts
          ui/src/pages/Dashboard.integration.test.tsx
          ui/src/pages/Inbox.test.tsx
          ui/src/pages/Issues.test.tsx
          ui/src/pages/Issues.integration.test.tsx
          --reporter=dot
      - name: Build UI
        run: pnpm --filter @paperclipai/ui build
      - name: UI artifact manifest
        run: |
          cd ui
          find dist -type f -print0 | sort -z | xargs -0 sha256sum > dist-sha256.txt
          sha256sum dist-sha256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-dist-${{ github.sha }}
          path: |
            ui/dist/
            ui/dist-sha256.txt
          if-no-files-found: warn
          retention-days: 7
