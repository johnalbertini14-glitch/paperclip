[pytest]
# PageIndex Test Configuration

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio configuration
asyncio_mode = auto

# Markers for test categorization
markers =
    integration: Integration tests with Paperclip
    asyncio: Async test using pytest-asyncio
    performance: Performance/benchmark tests
    security: Security/validation tests
    unit: Unit tests

# Coverage options
addopts =
    --verbose
    --strict-markers
    -ra

# Test paths
testpaths = tests

# Minimum Python version
minversion = 7.0
